# Builds the CPU container image on linux/arm64 without pushing it, then runs one-off
# checks inside it. It never starts the API or the worker. For Dockerfile.gpu it runs only
# `docker build --check`; the GPU image is built and run by the operator on the Spark
# (docs/deploy.md section 7). Not a required check.
name: Container image

on:
  push:
    branches: [main, impl]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: docker build (linux/arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate compose.yaml
        run: |
          cp .env.example .env
          docker compose config --quiet
          check='import json, sys; s = json.load(sys.stdin)["services"]; assert set(s) == {"api", "worker"}, sorted(s); v = {n: s[n]["environment"]["HF_HUB_DISABLE_TELEMETRY"] for n in s}; assert set(v.values()) == {sys.argv[1]}, v; w = s["worker"]["environment"]; assert (w["EARMARK_ASR_DEVICE"], w["EARMARK_ASR_COMPUTE_TYPE"]) == ("cuda", "float16"), w'
          docker compose config --format json | python3 -c "$check" 1
          HF_HUB_DISABLE_TELEMETRY=0 docker compose config --format json | python3 -c "$check" 0
      - name: Check Dockerfile.gpu (not built here)
        run: docker build --check -f Dockerfile.gpu .
      - name: Build the image
        run: docker build --tag earmark:ci .
      - name: Check the image
        run: |
          docker run --rm earmark:ci --version
          docker run --rm --entrypoint python earmark:ci -c "import ctranslate2, faster_whisper"
          test "$(docker run --rm --entrypoint id earmark:ci -u)" = 1000
          test "$(docker run --rm --entrypoint printenv earmark:ci HF_HUB_DISABLE_TELEMETRY)" = 1
          docker image ls earmark:ci
