# Opt-in live tests against Apple and real podcast feeds. Not a required check:
# a failure here usually means an outside service changed, not that a commit broke.
name: Network tests

on:
  schedule:
    - cron: "23 5 * * 1"   # Mondays 05:23 UTC, away from the top of the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  network:
    name: pytest -m network (linux/arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Same minor as the uv_build bound in pyproject.toml; bump both together.
          version: ">=0.13.9,<0.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true
          cache-python: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Network tests
        run: uv run --locked pytest -m network -v -rs
