# Opt-in live tests, run weekly or by hand. Neither job is a required check: a failure
# here usually means an outside service changed (Apple, podcast feeds, Hugging Face, a
# dependency release), not that a commit broke.
#   network: pytest -m network, real endpoints.
#   slow:    pytest -m slow, the real faster-whisper `tiny` model on CPU.
name: Live tests

on:
  schedule:
    - cron: "23 5 * * 1"   # Mondays 05:23 UTC, away from the top of the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  network:
    name: pytest -m network (linux/arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Same minor as the uv_build bound in pyproject.toml; bump both together.
          version: ">=0.13.9,<0.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true
          cache-python: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Network tests
        run: uv run --locked pytest -m network -v -rs

  slow:
    name: pytest -m slow (linux/arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Same minor as the uv_build bound in pyproject.toml; bump both together.
          version: ">=0.13.9,<0.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true
          cache-python: true
          cache-suffix: slow
      - name: Cache the Whisper model and the test clip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/earmark-tests
          key: slow-assets-${{ hashFiles('tests/slow_assets.py') }}
      - name: Install dependencies with the transcribe and youtube extras
        run: uv sync --locked --extra transcribe --extra youtube
      - name: Slow tests
        run: uv run --locked --extra transcribe --extra youtube pytest -m slow -v -rs
