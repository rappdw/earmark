# docker compose up -d    the API (CPU image) and the worker (GPU image, Dockerfile.gpu)
# The worker needs an NVIDIA GPU, the NVIDIA Container Toolkit, and Compose 2.30 or later.
# Settings come from .env (copy .env.example). See docs/deploy.md, section 7 for the GPU.
name: earmark

x-earmark: &earmark
  image: earmark:local
  build:
    context: .
    args:
      EXTRAS: ${EXTRAS:-transcribe youtube}
      UID: ${APP_UID:-1000}
      GID: ${APP_GID:-1000}
  env_file: .env
  environment: &earmark-env
    # In-container paths win over host paths that .env may hold for a native install.
    EARMARK_DATA_DIR: /data
    EARMARK_HOST: 0.0.0.0
    EARMARK_PORT: "8787"
    # Empty means unset: models go to the volume (`HF_HOME`).
    EARMARK_ASR_MODEL_DIR: ""
    # Empty means unset: commands run in a container read /data, never the API (step 34).
    EARMARK_API_URL: ""
    # Hugging Face telemetry off; HF_HUB_DISABLE_TELEMETRY=0 in .env turns it back on.
    HF_HUB_DISABLE_TELEMETRY: ${HF_HUB_DISABLE_TELEMETRY:-1}
  volumes:
    - data:/data
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  api:
    <<: *earmark
    command: ["serve"]
    ports:
      - ${API_BIND:-127.0.0.1:8787}:8787
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *earmark
    image: earmark:gpu
    build:
      context: .
      dockerfile: Dockerfile.gpu
      args:
        UID: ${APP_UID:-1000}
        GID: ${APP_GID:-1000}
    command: ["worker"]
    gpus: all
    environment:
      <<: *earmark-env
      # The GPU image exists to run on CUDA; with no GPU visible the worker refuses to start.
      EARMARK_ASR_DEVICE: cuda
      EARMARK_ASR_COMPUTE_TYPE: ${EARMARK_ASR_COMPUTE_TYPE:-float16}
    # SIGTERM releases the running job back to the queue; this only covers that.
    stop_grace_period: 2m

volumes:
  data:
