[project]
name = "earmark"
version = "0.1.0"
description = "Share a podcast episode, get its transcript."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.165.0",
  "uvicorn>=0.54.0",
  "pydantic>=2.14.4",
  "pydantic-settings>=2.16.3",
  "httpx2>=2.16.2",
  "httpcore2>=2.16.2",
  "typer>=0.29.2",
  "defusedxml>=0.7.1",
  "python-multipart>=0.0.34",
]

[project.optional-dependencies]
transcribe = [
  "faster-whisper>=1.2.1",
  # faster-whisper 1.2.1 breaks with PyAV 19 (av.open lost metadata_errors); drop this
  # bound once a faster-whisper release after 1.2.1 ships the fix. See docs/steps/08-transcribe.md 2.2.
  "av>=18.1,<19",
]

[project.scripts]
earmark = "earmark.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-socket>=0.8.1",
  "ruff>=0.17.6",
  "mypy>=2.4.1",
  "actionlint-py>=1.7.12.25",
  "pyyaml>=6.0.3",
  "types-pyyaml>=6.0.12.20261113",
  "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# Lock fails if any dependency ships wheels but none for the deployment platform
# (DGX Spark, linux/aarch64). See docs/steps/01-scaffold.md section 2.1.
required-environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
strict = true
addopts = [
  "-ra",
  "--disable-socket",
  "--allow-unix-socket",          # asyncio/TestClient need an AF_UNIX socketpair
  # NOTE: a command-line -m REPLACES this expression (last -m wins). `-m network` runs only
  # network tests, but `-m "not slow"` would also include network and gpu tests.
  "-m", "not network and not slow and not gpu and not smtp",
]
markers = [
  "network: hits real external endpoints (Apple, podcast feeds)",
  "slow: downloads a model, does CPU-heavy work, or needs the transcribe extra",
  "gpu: needs CUDA",
  "smtp: sends one real message through a configured SMTP server",
]
filterwarnings = [
  "error",
  # pytest-socket warns before raising SocketBlockedError; under "error" the warning
  # would replace the exception. The exception itself is still raised.
  "ignore:A test tried to use socket:UserWarning",
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
  "possibly-undefined",
  "deprecated",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
target-version = "py313"
per-file-target-version = { "plugins/**/*.py" = "py39" }
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "PT", "PIE", "RET",
  "SIM", "PTH", "S", "BLE", "LOG", "G", "ASYNC", "FAST", "PGH", "PERF", "RUF", "FA",
]
# Not selected on purpose: PL (PLC0415 conflicts with lazy imports of heavy deps),
# TC (moves runtime-needed annotations under TYPE_CHECKING; breaks pydantic/typer/FastAPI).

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S603"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
