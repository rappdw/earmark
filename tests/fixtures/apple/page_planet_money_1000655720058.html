 fact-checked by Sierra Juarez. Alex Goldmark is our executive producer.\u003Cbr />\u003Cbr />Help support Planet Money and hear our bonus episodes by subscribing to Planet Money+ in \u003C/em>\u003Ca href=\"http://n.pr/PM-digital\">\u003Cem>Apple Podcasts\u003C/em>\u003C/a>\u003Cem> or at \u003C/em>\u003Ca href=\"https://n.pr/3HlREPz\">\u003Cem>plus.npr.org/planetmoney\u003C/em>\u003C/a>\u003Cem>.\u003Cbr />\u003Cbr />Always free at these links: \u003C/em>\u003Ca href=\"http://n.pr/PM-digital\">\u003Cem>Apple Podcasts\u003C/em>\u003C/a>\u003Cem>, \u003C/em>\u003Ca href=\"https://n.pr/3gTkQlR\">\u003Cem>Spotify\u003C/em>\u003C/a>\u003Cem>, \u003C/em>\u003Ca href=\"https://n.pr/3iMBXqz\">\u003Cem>Google Podcasts\u003C/em>\u003C/a>\u003Cem>, the \u003C/em>\u003Ca href=\"https://n.pr/3Bkb17W\">\u003Cem>NPR app\u003C/em>\u003C/a>\u003Cem> or anywhere you get podcasts.\u003C/em>\u003Cbr />\u003Cbr />See \u003Ca href=\"https://pcm.adswizz.com\">pcm.adswizz.com\u003C/a> for information about our collection and use of personal data for sponsorship and to manage your podcast sponsorship preferences.\u003Cbr />\u003Cbr />\u003Ca href=\"https://www.npr.org/about-npr/179878450/privacy-policy\">NPR Privacy Policy\u003C/a>\u003C/p>","mediaType":"text/html","alignment":"left","isCollapsed":false,"isLinkDetectionEnabled":true,"episodeOffer":{"artwork":{"template":"https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/85/df/53/85df5334-0fae-28a9-2bc4-b97b81061d0e/mza_10839245066228881011.jpg/{w}x{h}bb.{f}","width":1400,"height":1400,"backgroundColor":"082f08","textColors":{"primary":"ffd3b3","secondary":"f5b48e","tertiary":"cdb290","quaternary":"c69973"},"crop":"bb","style":"roundedRect"},"contentId":"1000655720058","contentRating":"clean","episodeArtwork":{"template":"https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/49/a1/e4/49a1e474-432b-3b98-9acc-7e40c3469114/mza_11922695540738458612.jpg/{w}x{h}bb.{f}","width":2696,"height":2696,"backgroundColor":"cdaaee","textColors":{"
